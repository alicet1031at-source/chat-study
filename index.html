  padding:14px 16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700}
.topbar .tb-right{font-weight:400;color:var(--muted);white-space:nowrap}
.topbar .tb-back{border:0;background:none;color:var(--primary);font-weight:700;padding:0;min-height:44px;cursor:pointer}

/* 內容區 */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 28px}
.kicker{font-weight:700;color:var(--muted);margin-bottom:6px}
h1{font-size:24px;line-height:1.4;margin:0 0 14px}
h2.sec{font-size:17px;color:var(--muted);margin:22px 0 10px}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.list>.li{padding:12px 0;border-bottom:1px solid var(--line)}
.card.list>.li:last-child{border-bottom:0}
.card.list>.li:first-child{padding-top:2px}
.card .sep{color:#9aa1ae;margin:0 4px}
.card.warm{background:var(--warn-bg);border-color:var(--ai-line)}
.link{display:inline-block;border:0;background:none;padding:6px 0;min-height:44px;color:var(--primary);
  font-weight:700;text-decoration:underline;cursor:pointer;text-align:left}

/* 下方固定按鈕 */
.footer{flex:none;display:flex;flex-direction:column;gap:10px;background:#fff;border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.footer.row{flex-direction:row}
.footer.row .btn.secondary{flex:0 0 auto;width:auto;padding:0 18px}
.btn{width:100%;min-height:52px;border-radius:26px;border:1.5px solid var(--primary);font-size:17px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff}
.btn.secondary{background:#fff;color:var(--primary)}
.btn:disabled{opacity:.4;cursor:default}
.footer-label{font-weight:700;color:var(--muted)}

/* 問卷 */
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.qcard.err{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.qcard.off{opacity:.45}
.qtext{font-weight:700;margin-bottom:12px}
.errmsg{color:var(--err);font-weight:700;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px 8px 12px;border-radius:22px;
  border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.chip.sel{border-color:var(--primary);background:var(--primary-soft)}
.radio{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #9aa3b2;display:inline-block;position:relative}
.sel>.radio{border-color:var(--primary)}
.sel>.radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sbtn{height:44px;border-radius:22px;border:1.5px solid var(--line);background:#fff;font-size:17px;cursor:pointer;padding:0}
.sbtn.sel{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.anchors{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted)}
.txt{width:100%;min-height:44px;margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#f8f9fb;font-size:16px}
textarea.txt{min-height:96px;resize:vertical}
.numrow{display:flex;align-items:center;gap:10px}
.numrow .txt{width:110px;margin-top:0}

/* 聊天室 */
.chathead{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;background:#dbe4f3;color:var(--primary);font-weight:700;font-size:18px;
  display:flex;align-items:center;justify-content:center}
.who{flex:1;line-height:1.3}
.who .name{font-weight:700;font-size:17px}
.who .status{color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#2e9d5b;display:inline-block}
.prog{color:var(--muted)}
.main.chat{background:var(--chat-bg);padding:16px 14px 20px}
.narr{margin:6px 6px 14px;padding:10px 14px;border:1px dashed #b9c0cc;border-radius:12px;color:var(--muted);text-align:center;background:#fafbfc}
.bubble{width:fit-content;max-width:82%;padding:10px 14px;border-radius:18px;margin:0 0 10px;word-break:break-word}
.bubble.r{background:var(--bubble-r);border-top-left-radius:6px}
.bubble.me{margin-left:auto;background:var(--primary);color:#fff;border-top-right-radius:6px}
.hidden{display:none !important}
.banner{flex:none;background:#e4e8f0;color:var(--muted);text-align:center;padding:8px 12px}

/* AI 提示 */
.aibox{background:var(--ai-bg);border:1.5px solid var(--ai-line);border-radius:14px;padding:12px 14px}
.ailabel{display:inline-flex;align-items:center;gap:6px;background:var(--ai-label);color:#fff;font-weight:700;border-radius:14px;padding:2px 12px;margin-bottom:8px}
.aibox p{margin:0}
.sec-ai{margin-top:8px}
.aibox.inchat{margin:6px 0 4px}
.bubble.typing{color:var(--muted)}

/* 判斷與回應選項 */
.question{font-size:19px;font-weight:700;line-height:1.55;margin:4px 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px 16px;margin-bottom:12px;
  border:1.5px solid var(--line);border-radius:14px;background:#fff;text-align:left;font-size:17px;cursor:pointer}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.resp{width:100%;min-height:48px;padding:11px 16px;border:1.5px solid var(--primary);border-radius:14px;background:#fff;
  color:var(--primary);text-align:left;cursor:pointer}

/* 測試面板 */
#dbg{position:fixed;top:64px;right:6px;opacity:.9;z-index:40;max-width:240px;background:rgba(20,24,33,.88);color:#fff;
  font:12px/1.5 ui-monospace,Menlo,monospace;border-radius:8px;padding:6px 8px}
#dbg select,#dbg button{font:12px ui-monospace,monospace;margin:3px 3px 0 0;color:#000}
#dbg .warn{color:#ffcf5a}
#dbg .body{display:none}
#dbg.open .body{display:block}
#dbg .sum{cursor:pointer;white-space:nowrap}
</style>

<body>
<div id="app"></div>
<noscript>請開啟瀏覽器的 JavaScript 才能參加這項研究。</noscript>
<script>
(function () {
'use strict';

/* =====================================================================
 * 程式區：一般情況不需要修改。文字請改檔案開頭的 CONFIG。
 * ===================================================================== */

var C = CONFIG;
var params = new URLSearchParams(location.search);
var P_GROUP = (function (g) { return g === 'ai' || g === 'none' ? g : null; })(params.get('group'));
var DEBUG = params.get('debug') === '1';
var PILOT = params.get('pilot') === '1';
var DEMO = params.get('demo') === '1';                 // 體驗模式：完全不呼叫後端
var TEST = !DEMO && (!!P_GROUP || DEBUG);              // 測試：照常送資料，標記 test，不佔分派序列
var MODE = DEMO ? 'demo' : TEST ? 'test' : 'live';
var SUFFIX = DEMO ? '_demo' : '';                      // 體驗模式的進度另外存，不影響正式作答
var KEY = 'dsim_state_v1' + SUFFIX;                    // 作答進度
var DONE_KEY = 'dsim_done_v1' + SUFFIX;                // 這支手機已完成
var SESSION_FIN = 'dsim_fin_session' + SUFFIX;
var QUEUE_KEY = 'dsim_queue_v1';                       // 待傳佇列
var N = C.nodes.length;

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}

/* ---------- 狀態 ---------- */
function fresh() {
  return { v: 1, stage: 'consent', consented: false, answers: {}, nodes: {}, nodeIdx: 0, nodeStep: 'read',
           tmpJudge: {}, revealed: {}, replied: {}, debriefIdx: 0, group: null, pid: null,
           flags: { under18: 0, attention_pre: null, attention_post: null, pilot: PILOT ? 1 : 0 },
           uid: uuid(), mode: MODE, createdAt: Date.now() };
}
function loadJSON(store, k) { try { return JSON.parse(store.getItem(k)); } catch (e) { return null; } }
function saveJSON(store, k, v) { try { store.setItem(k, JSON.stringify(v)); } catch (e) {} }

var S = loadJSON(localStorage, KEY);
if (!S || S.v !== 1) S = fresh();
if (P_GROUP && S.group) S.group = P_GROUP;        // 測試用：網址指定組別時直接套用
if (PILOT) S.flags.pilot = 1;

// 同意之前不寫入任何資料
function save() { if (S.consented) saveJSON(localStorage, KEY, S); }

/* ---------- 計時（測試面板用；正式紀錄下一步補） ---------- */
var screenStart = Date.now();
var timers = [];
function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

/* ---------- 工具 ---------- */
function h(tag, props) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function append(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { append(e, x); }); return; }
  e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
}
function reward() { return C.reward[C.meta.rewardVersion] || null; }
function fill(t) {
  var r = reward();
  return String(t)
    .replace(/\{rewardShort\}/g, r ? r.short : '【待補】')
    .replace(/\{rewardItem\}/g, r ? r.item : '【待補】')
    .replace(/\{rewardFull\}/g, r ? r.full : '【待補】');
}
function withPid(t, pid) {   // {pid} 換成粗體編號
  var parts = fill(t).split('{pid}'), out = [];
  parts.forEach(function (p, i) { if (i) out.push(h('strong', null, pid || '—')); out.push(p); });
  return out;
}
function paras(list, cls) { return (list || []).map(function (p) { return h('p', cls ? { class: cls } : null, fill(p)); }); }
function btn(label, onclick, cls, disabled) {
  return h('button', { type: 'button', class: 'btn ' + (cls || 'primary'), onclick: onclick, disabled: !!disabled }, label);
}
function topbar(left, right) {
  return h('header', { class: 'topbar' }, h('div', null, left), right ? h('div', { class: 'tb-right' }, right) : null);
}
function screen(o) {
  clearTimers();
  closeOverlay();
  var app = document.getElementById('app');
  app.innerHTML = '';
  if (o.top) app.appendChild(o.top);
  if (o.banner) app.appendChild(o.banner);
  var main = h('main', { class: 'main ' + (o.mainClass || '') }, o.kicker ? h('div', { class: 'kicker' }, o.kicker) : null, o.body);
  app.appendChild(main);
  if (o.footer) app.appendChild(h('footer', { class: 'footer ' + (o.footerClass || '') }, o.footer));
  return main;
}
function mainEl() { return document.querySelector('#app .main'); }

var overlayEl = null;
function closeOverlay() { if (overlayEl) { overlayEl.remove(); overlayEl = null; } }
function overlay(title, content, footer) {
  closeOverlay();
  overlayEl = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true' },
    h('header', { class: 'topbar' }, h('div', null, title),
      h('button', { type: 'button', class: 'tb-back', onclick: closeOverlay }, C.ui.close)),
    h('div', { class: 'main' }, content),
    footer ? h('footer', { class: 'footer' }, footer) : null);
  document.body.appendChild(overlayEl);
}

/* ---------- 換頁 ---------- */
function go(stage, extra) {
  S.stage = stage;
  if (extra) Object.keys(extra).forEach(function (k) { S[k] = extra[k]; });
  screenStart = Date.now();
  save();
  render();
  var m = mainEl(); if (m) m.scrollTop = 0;
}
function rerender() {   // 同一畫面重畫，保留捲動位置
  var m = mainEl(), st = m ? m.scrollTop : 0;
  render();
  m = mainEl(); if (m) m.scrollTop = st;
}

// 瀏覽器返回鍵不讓流程倒退
history.replaceState({ k: 1 }, '', location.href);
history.pushState({ k: 2 }, '', location.href);
window.addEventListener('popstate', function () {
  if (overlayEl) closeOverlay();
  history.pushState({ k: 2 }, '', location.href);
});

/* ---------- 後端：分派與資料傳送 ---------- */
function backendReady() { return /^https:\/\//.test(C.meta.gasUrl || ''); }
function postJSON(body) {   // text/plain：不觸發 CORS 預檢
  return fetch(C.meta.gasUrl, { method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function device() {
  return { userAgent: navigator.userAgent, screenW: window.screen.width, screenH: window.screen.height,
           viewportW: window.innerWidth, viewportH: window.innerHeight, dpr: window.devicePixelRatio || 1 };
}
function pickAnswers(prefixes) {
  var o = {};
  Object.keys(S.answers).forEach(function (k) {
    if (prefixes.some(function (p) { return k.indexOf(p) === 0; })) o[k] = S.answers[k];
  });
  return o;
}

// 讀完基礎教材時呼叫。已取得編號就不再分派（重新整理、斷線重連都一樣）
function allocate(ok, fail) {
  if (S.pid && S.group) return ok();
  if (DEMO) { S.group = P_GROUP || (Math.random() < 0.5 ? 'ai' : 'none'); S.pid = 'DEMO'; save(); return ok(); }
  if (!backendReady()) {
    if (!TEST) return fail('no_backend_url');
    S.group = P_GROUP || (Math.random() < 0.5 ? 'ai' : 'none'); S.pid = 'TLOCAL'; S.noBackend = true;   // 測試且還沒設網址：只在本機跑
    save(); return ok();
  }
  var body = { id: uuid(), type: 'allocate', clientId: S.uid, mode: S.mode, pilot: S.flags.pilot,
    forcedGroup: P_GROUP, sentAt: Date.now(),
    data: Object.assign({ sex: S.answers.pre1_1, under18: S.flags.under18, attention_pre: S.flags.attention_pre,
                          consentAt: S.consentAt, startedAt: S.createdAt }, device(), pickAnswers(['pre1_', 'pre2_'])) };
  postJSON(body).then(function (res) {
    if (res && res.ok && res.participantId && res.group) {
      S.pid = res.participantId; S.group = res.group; S.allocPosition = res.position; S.assignedAt = Date.now();
      save(); ok();
    } else fail((res && res.error) || 'unknown');
  }).catch(function () { fail('network'); });
}

// 待傳佇列：先存 localStorage，依序送出；每 10 秒或恢復連線時重送
var Q = loadJSON(localStorage, QUEUE_KEY) || [];
var flushing = false, lastSendError = null;
function saveQ() { saveJSON(localStorage, QUEUE_KEY, Q); }
function enqueue(type, data) {
  if (DEMO || S.noBackend) return;
  Q.push({ id: uuid(), type: type, clientId: S.uid, participantId: S.pid, mode: S.mode, pilot: S.flags.pilot,
           sentAt: Date.now(), data: data });
  saveQ(); flush();
}
function flush() {
  if (flushing || !Q.length || !backendReady()) return;
  flushing = true;
  postJSON(Q[0]).then(function (res) {
    flushing = false;
    if (res && res.ok) { Q.shift(); saveQ(); lastSendError = null; flush(); }   // 重複的 id 後端也回 ok
    else lastSendError = (res && res.error) || 'unknown';
  }).catch(function () { flushing = false; lastSendError = 'network'; });
}
setInterval(flush, 10000);
window.addEventListener('online', flush);

/* =====================================================================
 * 畫面
 * ===================================================================== */
function render() {
  switch (S.stage) {
    case 'consent': return rConsent();
    case 'declined': return rDeclined();
    case 'pre1': return rSurvey('pre1', function () {
      var age = parseInt(S.answers.pre1_2, 10);
      S.flags.under18 = !isNaN(age) && age < C.meta.minAge ? 1 : 0;
      go('pre2');
    });
    case 'pre2': return rSurvey('pre2', function () {
      S.flags.attention_pre = S.answers['pre2_se_6'] === 2 ? 1 : 0;
      go('material');
    });
    case 'material': return rMaterial();
    case 'scenario': return rScenario();
    case 'instructions': return rInstructions();
    case 'node': return rNode();
    case 'simEnd': return rSimEnd();
    case 'post1': return rSurvey('post1', function () {
      S.flags.attention_post = S.answers['post1_se_6'] === 2 ? 1 : 0;
      go('post2');
    });
    case 'post2': return rSurvey('post2', function () {
      S.postAt = Date.now();
      enqueue('post', Object.assign({ attention_post: S.flags.attention_post,
        attention_pass: S.flags.attention_pre === 1 && S.flags.attention_post === 1 ? 1 : 0,
        postAt: S.postAt }, pickAnswers(['post1_', 'post2_'])));
      go('debrief', { debriefIdx: 0 });
    });
    case 'debrief': return rDebrief();
    case 'finished': return rFinished(S.pid);
    default: S = fresh(); return rConsent();
  }
}

/* ---------- 知情同意 ---------- */
function rConsent() {
  var c = C.consent;
  screen({
    top: topbar(c.header, c.headerRight),
    body: [
      h('h1', null, c.title),
      h('p', null, c.intro),
      h('div', { class: 'card list' }, c.items.map(function (it) {
        return h('div', { class: 'li' }, h('strong', null, it.label), h('span', { class: 'sep' }, '｜'), fill(it.text));
      })),
      h('p', { class: 'muted' }, c.statement),
      h('button', { type: 'button', class: 'link', onclick: openFullConsent }, c.fullTextLinkLabel)
    ],
    footer: [btn(c.agree, agree), btn(c.disagree, disagree, 'secondary')]
  });
}
function agree() { S.consented = true; S.consentAt = Date.now(); go('pre1'); }
function disagree() { S = fresh(); try { localStorage.removeItem(KEY); } catch (e) {} go('declined'); }
function openFullConsent() {
  var f = C.consent.full;
  var body = [h('h1', null, f.title), paras(f.metaLines, 'muted'), paras(f.greeting)];
  f.sections.forEach(function (sec) {
    body.push(h('h2', { class: 'sec' }, sec.title));
    body.push(paras(sec.paragraphs));
    if (sec.orderedList) body.push(h('ol', null, sec.orderedList.map(function (t) { return h('li', null, fill(t)); })));
    if (sec.after) body.push(paras(sec.after));
    if (sec.bullets) body.push(h('ul', null, sec.bullets.map(function (t) { return h('li', null, fill(t)); })));
  });
  overlay(C.consent.headerRight, body, [btn(f.agree, agree), btn(f.disagree, disagree, 'secondary')]);
}
function rDeclined() {
  var d = C.declined;
  screen({ kicker: d.header, body: [h('h1', null, d.title), paras(d.paragraphs)],
           footer: [btn(d.button, function () { go('consent'); }, 'secondary')] });
}

/* ---------- 問卷 ---------- */
var errIds = {};
function answered(id) { var v = S.answers[id]; return v != null && v !== ''; }
function isOff(q) {   // 條件題：不需作答時變灰、不可點
  return q.showIf ? S.answers[q.showIf.id] === q.showIf.notEquals : false;
}
function clearErr(card, id) {
  delete errIds[id];
  card.classList.remove('err');
  var m = card.querySelector('.errmsg'); if (m) m.remove();
}
function qCard(q, num, scaleLabels) {
  var a = S.answers, off = isOff(q);
  if (off) { delete a[q.id]; delete a[q.id + '_other']; }
  var card = h('div', { class: 'qcard' + (off ? ' off' : '') + (errIds[q.id] ? ' err' : ''), 'data-qid': q.id },
    h('div', { class: 'qtext' }, num + '. ' + q.text));

  if (q.type === 'single') {
    var wrap = h('div', { class: 'chips', role: 'radiogroup' });
    q.options.forEach(function (o) {
      var sel = a[q.id] === o.v;
      wrap.appendChild(h('button', {
        type: 'button', class: 'chip' + (sel ? ' sel' : ''), role: 'radio', 'aria-checked': sel ? 'true' : 'false', disabled: off,
        onclick: function () {
          a[q.id] = o.v;
          if (!o.other) delete a[q.id + '_other'];
          delete errIds[q.id];
          save(); rerender();
        }
      }, h('span', { class: 'radio' }), o.label));
    });
    card.appendChild(wrap);
    var so = q.options.filter(function (o) { return o.v === a[q.id]; })[0];
    if (so && so.other) {
      card.appendChild(h('input', { class: 'txt', type: 'text', placeholder: C.ui.otherPlaceholder, value: a[q.id + '_other'] || '',
        oninput: function (e) { a[q.id + '_other'] = e.target.value; save(); } }));
    }
  } else if (q.type === 'scale7') {
    var row = h('div', { class: 'scale', role: 'radiogroup' });
    for (var i = 1; i <= 7; i++) (function (i) {
      var sel = a[q.id] === i;
      row.appendChild(h('button', {
        type: 'button', class: 'sbtn' + (sel ? ' sel' : ''), role: 'radio', 'aria-checked': sel ? 'true' : 'false',
        'aria-label': String(i),
        onclick: function () {
          a[q.id] = i; save();
          Array.prototype.forEach.call(row.children, function (b, k) {
            b.classList.toggle('sel', k === i - 1); b.setAttribute('aria-checked', k === i - 1 ? 'true' : 'false');
          });
          clearErr(card, q.id);
        }
      }, String(i)));
    })(i);
    card.appendChild(row);
    card.appendChild(h('div', { class: 'anchors' }, h('span', null, scaleLabels.min), h('span', null, scaleLabels.max)));
  } else if (q.type === 'number') {
    card.appendChild(h('div', { class: 'numrow' },
      h('input', { class: 'txt', type: 'text', inputmode: 'numeric', maxlength: '3', value: a[q.id] || '',
        oninput: function (e) {
          var v = e.target.value.replace(/\D/g, ''); e.target.value = v; a[q.id] = v; save();
          if (v) clearErr(card, q.id);
        } }),
      q.unit ? h('span', null, q.unit) : null));
  } else if (q.type === 'text') {
    card.appendChild(h('textarea', { class: 'txt', placeholder: q.placeholder || '', value: a[q.id] || '',
      oninput: function (e) { a[q.id] = e.target.value; save(); } }));
  }
  if (errIds[q.id]) card.appendChild(h('div', { class: 'errmsg' }, C.ui.requiredHint));
  return card;
}
function validate(questions) {
  errIds = {};
  var missing = questions.filter(function (q) { return q.required && !isOff(q) && !answered(q.id); });
  if (!missing.length) return true;
  missing.forEach(function (q) { errIds[q.id] = 1; });
  rerender();
  var first = document.querySelector('[data-qid="' + missing[0].id + '"]');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return false;
}
function rSurvey(key, onNext) {
  var sv = C.surveys[key], body = [h('h1', null, sv.title)], questions = [], n = 0;
  if (sv.intro) body.push(h('p', { class: 'muted' }, sv.intro));
  var instr = sv.instructions === 'SAME_AS_PRE2' ? C.surveys.pre2.instructions : sv.instructions;
  body.push(paras(instr, 'muted'));
  function add(qs, labels) {
    qs.forEach(function (q) {
      if (q.aiOnly && S.group !== 'ai') return;
      n++; questions.push(q); body.push(qCard(q, n, labels || sv.scaleLabels));
    });
  }
  if (sv.sections) {
    sv.sections.forEach(function (sec) {
      if (sec.aiOnly && S.group !== 'ai') return;
      if (sec.title) body.push(h('h2', { class: 'sec' }, sec.title));
      if (sec.instruction) body.push(h('p', { class: 'muted' }, sec.instruction));
      add(sec.questions, sec.scaleLabels);
    });
  } else if (sv.questions === 'SE_ITEMS') {
    add(C.seItems.map(function (q) { var c = {}; for (var k in q) c[k] = q[k]; c.id = key + '_' + q.id; return c; }));
  } else add(sv.questions);
  screen({ top: topbar(sv.header, sv.progress), body: body,
           footer: [btn(sv.button, function () { if (validate(questions)) { errIds = {}; onNext(); } })] });
}

/* ---------- 教材、情境、作答說明 ---------- */
function rMaterial() {
  var m = C.material, body = [];
  m.sections.forEach(function (s, i) {
    body.push(h('h1', i ? { style: 'margin-top:30px' } : null, s.title));
    body.push(paras(s.paragraphs));
  });
  screen({ top: topbar(m.header), body: body,
           footer: [startAlloc(m.button)] });
}
function startAlloc(label) {   // 按下後先分派，成功才進入情境說明
  var b = btn(label, function () {
    b.disabled = true; b.textContent = C.ui.busy;
    allocate(function () { go('scenario'); }, rAllocError);
  });
  return b;
}
function rAllocError(err) {   // 序列用完或分派失敗
  var e = C.allocError;
  screen({ kicker: e.header, body: [h('h1', null, e.title), paras(e.paragraphs), h('p', { class: 'muted' }, '代碼：' + err)],
           footer: [startAlloc(e.retry)] });
}
function rScenario() {
  var s = C.scenario;
  screen({ kicker: s.header, body: [h('h1', null, s.title), paras(s.paragraphs)],
           footer: [btn(s.button, function () { go('instructions'); })] });
}
function rInstructions() {
  var s = C.instructions, body = [h('h1', null, s.title), paras(s.paragraphs)];
  if (S.group === 'ai') body.push(h('div', { class: 'aibox sec-ai' },
    h('div', { class: 'ailabel' }, s.aiSection.title), h('p', null, s.aiSection.text)));
  screen({ kicker: s.header, body: body,
           footer: [btn(s.button, function () { go('node', { nodeIdx: 0, nodeStep: 'read' }); })] });
}

/* ---------- 評量節點 ----------
 * 步驟：read（閱讀對話＋AI 提示）→ judge（風險判斷，可回看）→ respond（選擇回應）→ reply（角色回覆與匯合）
 * 計時一律用 performance.now()，毫秒取整數。T 只存在記憶體；算好的時長寫進 S.nodes[節點代號]。
 * 重新整理時 performance.now() 會歸零，該步驟從重新顯示時起算，並在 reloads 記一次。
 */
var T = {};            // 本節點進行中的計時起點
var reviewing = false; // 判斷時是否在回看對話
function now() { return performance.now(); }
function ms(x) { return Math.round(x); }
function curNode() { return C.nodes[S.nodeIdx]; }
function rec() { return S.nodes[curNode().id]; }
function ensureRec(nd) {
  if (!S.nodes[nd.id]) {
    var ai = S.group === 'ai';
    S.nodes[nd.id] = {
      order: S.nodeIdx + 1, nodeId: nd.id, type: nd.type, group: S.group,
      promptId: ai ? nd.promptId : null, promptVersion: ai ? C.meta.promptVersion : null,
      animTime: null, readTime: null, promptTime: null,
      rt: null, reviewCount: 0, reviewTime: 0,
      judgment: null, correct: null, response: null, branch: null, responseTime: null,
      hiddenCount: 0, hiddenTime: 0, reloads: 0, startedAt: Date.now(), endedAt: null
    };
  }
  return S.nodes[nd.id];
}
function chatHead() {
  return h('header', { class: 'chathead' },
    h('div', { class: 'avatar', 'aria-hidden': 'true' }, C.meta.characterName),
    h('div', { class: 'who' }, h('div', { class: 'name' }, C.meta.characterName),
      h('div', { class: 'status' }, h('span', { class: 'dot' }), C.meta.characterStatus)),
    h('div', { class: 'prog' }, (S.nodeIdx + 1) + ' / ' + N));
}
function narr(t) { return h('div', { class: 'narr' }, t); }
function rBubble(t) { return h('div', { class: 'bubble r' }, t); }
function chatItems(nd) { return [narr(nd.background)].concat(nd.messages.map(rBubble)); }
function aiBox(nd) {
  return h('div', { class: 'aibox inchat', role: 'note' },
    h('div', { class: 'ailabel' }, C.ui.aiPromptLabel), h('p', null, C.prompts[nd.promptId]));
}
function scrollBottom() { var m = mainEl(); if (m) m.scrollTop = m.scrollHeight; }
function setStep(step) { S.nodeStep = step; reviewing = false; screenStart = Date.now(); save(); render(); }

// 「輸入中…」→ 訊息。cb 在訊息出現時呼叫
function typeIn(container, text, delay, cb) {
  var typing = h('div', { class: 'bubble r typing', 'aria-live': 'polite' }, C.ui.typing);
  later(function () { container.appendChild(typing); scrollBottom(); }, delay);
  later(function () {
    typing.replaceWith(rBubble(text)); scrollBottom(); if (cb) cb();
  }, delay + C.meta.messageIntervalMs);
}

function rNode() {
  var nd = curNode(), r = ensureRec(nd), ai = S.group === 'ai', ui = C.ui;

  switch (S.nodeStep) {

    /* 1–2. 閱讀對話（＋AI 提示） */
    case 'read': {
      var chat = h('div', null, narr(nd.background));
      var box = ai ? aiBox(nd) : null;
      var startBtn = btn(ui.startJudge, function () {
        var t = now();
        r.readTime = ms(t - T.lastMsgAt);
        if (ai) r.promptTime = T.promptSeenAt != null ? ms(t - T.promptSeenAt) : null;
        if (T.io) T.io.disconnect();
        save(); setStep('judge');
      });
      startBtn.style.visibility = 'hidden';
      if (box) box.classList.add('hidden');
      screen({ top: chatHead(), mainClass: 'chat', body: [chat, box], footer: [startBtn] });

      var allShown = function () {
        T.lastMsgAt = now();
        if (box) {   // 提示框真的進入畫面才起算
          box.classList.remove('hidden'); scrollBottom();
          T.promptSeenAt = null;
          T.io = new IntersectionObserver(function (es) {
            es.forEach(function (e) {
              if (e.isIntersecting && T.promptSeenAt == null) { T.promptSeenAt = now(); T.io.disconnect(); }
            });
          }, { root: mainEl(), threshold: 0.5 });
          T.io.observe(box);
        }
        startBtn.style.visibility = 'visible';
      };

      if (S.revealed[nd.id]) {          // 重新整理後：直接顯示全部訊息
        nd.messages.forEach(function (m) { chat.appendChild(rBubble(m)); });
        allShown();
      } else {
        T.animStart = now();
        nd.messages.forEach(function (m, i) {
          var last = i === nd.messages.length - 1;
          typeIn(chat, m, C.meta.messageIntervalMs * i, last ? function () {
            r.animTime = ms(now() - T.animStart);
            S.revealed[nd.id] = Date.now(); save();
            allShown();
          } : null);
        });
      }
      return;
    }

    /* 3. 風險判斷（可回看對話） */
    case 'judge': {
      if (T.judgeStart == null) T.judgeStart = now();
      var sel = S.tmpJudge[nd.id];

      if (reviewing) {
        screen({ top: chatHead(), banner: h('div', { class: 'banner' }, ui.reviewBanner),
                 mainClass: 'chat', body: [chatItems(nd), ai ? aiBox(nd) : null],
                 footerClass: 'row',
                 footer: [btn('‹ ' + ui.backToJudge, function () {
                   r.reviewTime += ms(now() - T.reviewStart); T.reviewStart = null;
                   reviewing = false; save(); render();
                 }, 'secondary')] });
        return;
      }

      screen({
        top: chatHead(), kicker: ui.judgeLabel,
        body: [h('div', { class: 'question' }, C.judgment.question),
          C.judgment.options.map(function (o) {
            return h('button', { type: 'button', class: 'opt' + (sel === o.v ? ' sel' : ''), role: 'radio',
              'aria-checked': sel === o.v ? 'true' : 'false',
              onclick: function () { S.tmpJudge[nd.id] = o.v; save(); rerender(); } },
              h('span', { class: 'radio' }), o.label);
          })],
        footerClass: 'row',
        footer: [btn('‹ ' + ui.reviewChat, function () {
                   r.reviewCount++; T.reviewStart = now(); reviewing = true; save(); render();
                 }, 'secondary'),
                 btn(ui.submitJudge, function () {
                   r.rt = ms(now() - T.judgeStart);
                   r.judgment = S.tmpJudge[nd.id];
                   r.correct = nd.key == null ? null : (r.judgment === nd.key ? 1 : 0);
                   save(); setStep('respond');
                 }, 'primary', sel == null)]
      });
      return;
    }

    /* 4. 選擇回應 */
    case 'respond':
      if (T.respStart == null) T.respStart = now();
      screen({ top: chatHead(), mainClass: 'chat', body: chatItems(nd),
               footer: [h('div', { class: 'footer-label' }, ui.responseLabel),
                 nd.responses.map(function (x, i) {
                   return h('button', { type: 'button', class: 'resp', onclick: function () {
                     r.responseTime = ms(now() - T.respStart);
                     r.response = i + 1; r.branch = x.id;
                     save(); setStep('reply');
                   } }, x.text);
                 })] });
      scrollBottom();
      return;

    /* 5. 角色回覆與匯合 */
    case 'reply': {
      var x = nd.responses[r.response - 1];
      var chat2 = h('div', null, chatItems(nd), h('div', { class: 'bubble me' }, x.text));
      var nextBtn = btn(ui.nextNode, function () {
        r.endedAt = Date.now(); T = {}; save();
        enqueue('node', r);
        if (S.nodeIdx < N - 1) { S.nodeIdx++; S.nodeStep = 'read'; go('node'); }
        else go('simEnd');
      });
      nextBtn.style.visibility = 'hidden';
      screen({ top: chatHead(), mainClass: 'chat', body: chat2, footer: [nextBtn] });
      scrollBottom();
      var showMerge = function () {
        chat2.appendChild(narr(nd.merge)); scrollBottom();
        S.replied[nd.id] = Date.now(); save();
        nextBtn.style.visibility = 'visible';
      };
      if (S.replied[nd.id]) { chat2.appendChild(rBubble(x.reply)); showMerge(); }
      else typeIn(chat2, x.reply, 0, function () { later(showMerge, C.meta.messageIntervalMs); });
      return;
    }
  }
}

/* 節點進行中切到別的 App：記離開次數與總時長（rt 照常計算） */
document.addEventListener('visibilitychange', function () {
  if (unloading || S.stage !== 'node' || !S.nodes[curNode().id]) return;
  var r = rec();
  if (document.hidden) {
    r.hiddenCount++; T.hiddenStart = now(); S.hiddenSinceWall = Date.now();
  } else if (T.hiddenStart != null) {
    r.hiddenTime += ms(now() - T.hiddenStart); T.hiddenStart = null; S.hiddenSinceWall = null;
  }
  save();
});

// 重新整理或關閉頁面也會觸發 hidden（各瀏覽器先後順序不同）；這種情況不算切到別的 App
var unloading = false;
window.addEventListener('pagehide', function () {
  unloading = true;
  if (S.stage === 'node' && S.nodes[curNode().id] && S.hiddenSinceWall) {
    rec().hiddenCount--; S.hiddenSinceWall = null; save();
  }
});
window.addEventListener('pageshow', function () { unloading = false; });

/* ---------- 模擬結束、事後說明、完成 ---------- */
function rSimEnd() {
  var s = C.simEnd;
  screen({ kicker: s.header, body: [h('h1', null, s.title), paras(s.paragraphs)],
           footer: [btn(s.button, function () { go('post1'); })] });
}
function resourceCards() {
  return C.debrief[2].resources.map(function (r) {
    return h('div', { class: 'card' }, h('h3', null, r.title), h('div', null, r.text));
  });
}
function rDebrief() {
  var d = C.debrief[S.debriefIdx], body = [h('h1', null, d.title)], pending = false;
  if (d.paragraphs) body.push(paras(d.paragraphs));
  if (d.intro) body.push(h('p', null, d.intro));
  if (d.cards) body.push(d.cards.map(function (c) { return h('div', { class: 'card' }, h('h3', null, c.title), h('div', null, c.text)); }));
  if (d.outro) body.push(h('p', null, d.outro));
  if (d.resources) {
    body.push(resourceCards());
    body.push(h('h2', { class: 'sec' }, d.contactTitle), d.contacts.map(function (t) { return h('div', null, t); }));
    var pending = Q.length > 0 && !DEMO && !S.noBackend;   // 資料還沒送完：先不顯示編號
    body.push(h('h2', { class: 'sec' }, d.dataTitle),
      pending ? h('p', { class: 'card warm' }, C.ui.sending) : h('p', null, withPid(d.dataText, S.pid)));
  }
  var last = S.debriefIdx === C.debrief.length - 1;
  screen({ kicker: d.header, body: body,
           footer: [pending ? h('div', { class: 'footer-label', role: 'status' }, C.ui.sending) : null,
                    btn(d.button, function () {
             if (!last) go('debrief', { debriefIdx: S.debriefIdx + 1 });
             else finish();
           }, 'primary', pending)] });
  if (pending) {
    flush();
    later(function check() { if (!Q.length) rerender(); else { flush(); later(check, 1000); } }, 1000);
  }
}
function finish() {
  S.finishedAt = Date.now();
  enqueue('finish', { finishedAt: S.finishedAt, totalTimeSec: Math.round((S.finishedAt - S.consentAt) / 1000) });
  if (DEMO) {   // 體驗模式：不記錄已完成，重新整理就能再玩一次
    go('finished');
    try { localStorage.removeItem(KEY); } catch (e) {}
    return;
  }
  saveJSON(localStorage, DONE_KEY, { pid: S.pid, at: S.finishedAt });
  try { sessionStorage.setItem(SESSION_FIN, '1'); } catch (e) {}
  go('finished');
}
function rFinished(pid) {
  var f = C.finished;
  screen({ kicker: f.header, body: [
    h('h1', null, f.title), paras(f.paragraphs),
    h('div', { class: 'card warm' }, h('h3', null, fill(f.rewardCard.title)), h('div', null, f.rewardCard.text)),
    h('div', { class: 'card' }, h('div', null, f.pidCard.pidLabel + ' ', h('strong', null, pid || '—')), h('div', null, f.pidCard.text)),
    paras(f.after)
  ] });   // 沒有任何按鈕
}
function rAlreadyDone(pid) {
  var d = C.alreadyDone;
  screen({ kicker: d.header, body: [
    h('h1', null, d.title), paras(d.paragraphs),
    h('div', { class: 'card' }, h('div', null, d.card.pidLabel + ' ', h('strong', null, pid || '—')),
      d.card.lines.map(function (t) { return h('div', null, t); })),
    paras(d.after),
    h('button', { type: 'button', class: 'link', onclick: function () {
      overlay(C.debrief[2].title, [h('h1', null, C.debrief[2].title), resourceCards()]);
    } }, d.resourcesLinkLabel)
  ] });
}

/* =====================================================================
 * 測試面板（?debug=1）
 * ===================================================================== */
function debugPanel() {
  var todo = (JSON.stringify(C).match(/【待補】/g) || []).length;
  var box = h('div', { id: 'dbg' });
  var head = h('div', { class: 'sum', onclick: function () { box.classList.toggle('open'); } });   // 點一下展開或收合
  var info = h('div');
  var sel = h('select', null, h('option', { value: '' }, '跳到節點…'),
    C.nodes.map(function (n, i) { return h('option', { value: i }, n.id + '（' + n.type + '）'); }));
  sel.addEventListener('change', function () {
    if (sel.value === '') return;
    S.consented = true;
    if (!S.pid) {   // 跳節點沒有前測資料，不送後端
      S.group = P_GROUP || (Math.random() < 0.5 ? 'ai' : 'none'); S.pid = 'TLOCAL'; S.noBackend = true;
    }
    S.nodeIdx = +sel.value; S.nodeStep = 'read'; sel.value = ''; T = {};
    go('node');
  });
  var reset = h('button', { type: 'button', onclick: function () {
    try { localStorage.removeItem(KEY); localStorage.removeItem(DONE_KEY); localStorage.removeItem(QUEUE_KEY);
          sessionStorage.removeItem(SESSION_FIN); } catch (e) {}
    location.reload();
  } }, '清除進度');
  var json = h('button', { type: 'button', onclick: showJSON }, 'JSON');
  var send = h('button', { type: 'button', onclick: flush }, '立即送出');
  var body = h('div', { class: 'body' }, info, sel, reset, json, send,
    !DEMO && !backendReady() ? h('div', { class: 'warn' }, '尚未設定 gasUrl') : null,
    todo ? h('div', { class: 'warn' }, 'CONFIG 還有 ' + todo + ' 處【待補】') : null);
  box.appendChild(head); box.appendChild(body);
  document.body.appendChild(box);
  setInterval(function () {
    var nd = S.stage === 'node' ? curNode().id + ' · ' + S.nodeStep : '—';
    var sec = ((Date.now() - screenStart) / 1000).toFixed(1);
    head.textContent = (box.classList.contains('open') ? '▴ ' : '▾ ') + (S.group || '未分派') + ' | ' +
      (S.stage === 'node' ? curNode().id + ' ' + S.nodeStep : S.stage) + ' | ' + sec + 's';
    info.innerHTML = '';
    append(info, [
      h('div', null, '模式：' + S.mode + (S.flags.pilot ? '＋pilot' : '') + (S.noBackend ? '（不送後端）' : '')),
      h('div', null, '組別：' + (S.group || '未分派') + (P_GROUP ? '（網址指定）' : '')),
      h('div', null, '編號：' + (S.pid || '—')),
      h('div', null, '待傳：' + Q.length + ' 筆' + (lastSendError ? '｜錯誤：' + lastSendError : '')),
      h('div', null, '階段：' + S.stage),
      h('div', null, '節點：' + nd),
      h('div', null, '本畫面：' + sec + ' s'),
      h('div', null, '全程：' + (S.consentAt ? ((Date.now() - S.consentAt) / 1000).toFixed(0) + ' s' : '—')),
      h('div', null, liveTimer())
    ]);
  }, 250);
}

function liveTimer() {   // 進行中的計時（秒）
  if (S.stage !== 'node') return '';
  var t = now(), f = function (x) { return ((t - x) / 1000).toFixed(1) + ' s'; };
  if (S.nodeStep === 'read' && T.lastMsgAt != null) return 'read 計時：' + f(T.lastMsgAt) + (T.promptSeenAt != null ? '｜prompt：' + f(T.promptSeenAt) : '');
  if (S.nodeStep === 'judge' && T.judgeStart != null) return 'rt 計時：' + f(T.judgeStart) + (reviewing ? '｜回看中：' + f(T.reviewStart) : '');
  if (S.nodeStep === 'respond' && T.respStart != null) return 'response 計時：' + f(T.respStart);
  return '';
}
function showJSON() {
  var data = { queue: Q, pid: S.pid, group: S.group, mode: S.mode, uid: S.uid, flags: S.flags, stage: S.stage, nodeIdx: S.nodeIdx, nodeStep: S.nodeStep,
               nodes: S.nodes, answers: S.answers };
  var text = JSON.stringify(data, null, 2);
  var pre = h('pre', { style: 'font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;margin:0' }, text);
  overlay('紀錄（JSON）', pre, [btn('複製', function () {
    try { navigator.clipboard.writeText(text); } catch (e) {}
  }, 'secondary')]);
}

/* ---------- 啟動 ---------- */
(function start() {
  var done = loadJSON(localStorage, DONE_KEY);
  var finThisSession = false;
  try { finThisSession = sessionStorage.getItem(SESSION_FIN) === '1'; } catch (e) {}
  if (done) {
    if (finThisSession) rFinished(done.pid);   // 剛完成後重新整理：仍顯示感謝頁
    else rAlreadyDone(done.pid);               // 之後再開啟：已完成頁
  } else {
    if (S.stage === 'node' && S.nodes[curNode().id]) {
      var r0 = S.nodes[curNode().id];
      r0.reloads++;                                   // 這一步的計時從重新顯示時起算
      if (S.hiddenSinceWall) {                        // 切走後頁面被系統關掉：用時鐘補算離開時間
        r0.hiddenTime += Date.now() - S.hiddenSinceWall; r0.hiddenTimeApprox = 1; S.hiddenSinceWall = null;
      }
      save();
    }
    render();
  }
  if (DEBUG) debugPanel();
  flush();   // 上次沒送完的資料
})();

})();
</script>

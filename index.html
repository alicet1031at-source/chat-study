<script>
/* =====================================================================
 * 程式主體（不需修改；文字請改上方的 CONFIG）
 * ===================================================================== */
(function () {
  "use strict";

  /* ---------- 常數與網址參數 ---------- */
  var params = new URLSearchParams(location.search);
  var DEMO = params.get("demo") === "1";      // 展示模式：完全不呼叫後端、不封鎖手機
  var DEBUG = params.get("debug") === "1";
  var FORCE_GROUP = (params.get("group") === "ai" || params.get("group") === "none") ? params.get("group") : null;
  // 測試資料：照常寫入試算表但標記 test: true，不佔分派序列，也不封鎖手機
  var TEST = !DEMO && (params.get("test") === "1" || DEBUG || !!FORCE_GROUP);
  var KEY = DEMO ? "meetoo_demo_" : "meetoo_";
  var LS_STATE = KEY + "state_v1";         // 目前進度
  var LS_DONE = KEY + "completed_v1";      // 這支手機已完成
  var LS_QUEUE = "meetoo_queue_v1";        // 待傳佇列
  var app = document.getElementById("app");
  var state = null;
  var stepEnteredAt = Date.now();
  var consentOpen = false;
  var pendingEmail = "";                   // 之後接後端時送出，不存進 localStorage
  var justFinished = false;                // 這次開啟頁面時剛按下「完成」

  /* ---------- 小工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function nodeIds() { return CONFIG.order; }
  function curNode() { return CONFIG.nodes[nodeIds()[state.nodeIdx]]; }
  function isAI() { return state.group === "ai"; }
  function progressText(n, total) {
    return CONFIG.ui.progressFormat.replace("{n}", n).replace("{total}", total);
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16);
    });
  }
  function toast(msg) {
    if (!msg) return;
    var old = document.querySelector(".toast"); if (old) old.remove();
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3000);
  }

  /* ---------- 狀態保存 ---------- */
  function freshState() {
    return {
      v: 1, screen: "consent", pid: null, clientId: null, group: null, test: TEST, noSend: false,
      nodeIdx: 0, step: "read", tmp: {},
      answers: { pre1: {}, pre2: {}, post1: {}, post2: {} },
      nodes: {}, drafts: {}, startedAt: null, resumes: 0, debriefDone: false
    };
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(LS_STATE)); if (s && s.v === 1) return s; } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch (e) {} }
  function isCompleted() { try { return localStorage.getItem(LS_DONE) === "1"; } catch (e) { return false; } }

  function go(screen) {
    clearAnim();
    state.screen = screen;
    state.tmp = {};
    stepEnteredAt = Date.now();
    save(); render();
  }
  function setStep(step) {
    state.step = step;
    stepEnteredAt = Date.now();
    save(); render();
  }

  /* =====================================================================
   * 後端（Apps Script）：分派與資料傳送
   * ===================================================================== */
  function backendReady() { return /^https:\/\/script\.google\.com\//.test(CONFIG.backend.url || ""); }
  function sendsData() { return !DEMO && !state.noSend; }
  function post(payload) {
    if (!backendReady()) return Promise.reject(new Error("no_backend"));
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, CONFIG.backend.timeout);
    // Content-Type 用 text/plain：屬於「簡單請求」，不會觸發 CORS 預檢
    return fetch(CONFIG.backend.url, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload), redirect: "follow", signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { clearTimeout(timer); return r.json(); },
      function (e) { clearTimeout(timer); throw e; });
  }

  /* 待傳佇列：先存進 localStorage，送成功才刪 */
  function qLoad() { try { return JSON.parse(localStorage.getItem(LS_QUEUE)) || []; } catch (e) { return []; } }
  function qSave(q) { try { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); } catch (e) {} }
  function enqueue(payload) {
    if (!sendsData()) return;
    var q = qLoad();
    if (!q.some(function (x) { return x.id === payload.id; })) q.push(payload);
    qSave(q); flush();
  }
  var flushing = false;
  function flush() {
    if (DEMO || flushing) return Promise.resolve();
    var q = qLoad(); if (!q.length) { onQueueChange(); return Promise.resolve(); }
    flushing = true;
    var i = 0;
    function step() {
      var cur = qLoad(); if (i >= cur.length) return Promise.resolve();
      var item = cur[i];
      return post(item).then(function (res) {
        if (res && res.ok) {
          qSave(qLoad().filter(function (x) { return x.id !== item.id; }));
        } else { i++; }
        return step();
      });
    }
    return step().catch(function () {}).then(function () { flushing = false; onQueueChange(); });
  }
  function queueEmpty(filterFn) {
    return !qLoad().some(filterFn || function () { return true; });
  }
  setInterval(flush, CONFIG.backend.retryInterval);
  window.addEventListener("online", flush);

  function onQueueChange() {
    if (!state) return;
    if (state.screen === "syncing" && queueEmpty(function (x) { return x.action !== "lottery"; })) go("debrief");
    if (state.screen === "debrief" && state.debriefDone && state.lotteryPending && queueEmpty(function (x) { return x.action === "lottery"; })) {
      state.lotteryPending = false; render();
    }
    updateDebug();
  }

  /* 建立檔案時分派：先問 Apps Script，拿到編號與組別才往下 */
  function assignThen(next) {
    if (state.pid && state.group) return go(next);          // 已分派過，不再分派
    if (!sendsData()) {
      state.group = state.group || assignGroup();
      state.pid = state.pid || (DEMO ? "DEMO" : "LOCAL");
      return go(next);
    }
    var btn = document.querySelector('[data-act^="submitSurvey:pre2"]');
    if (btn) { btn.disabled = true; btn.textContent = CONFIG.ui.messages.sending; }
    var a = state.answers;
    post({
      action: "assign", id: state.clientId, clientId: state.clientId, test: TEST, forceGroup: FORCE_GROUP,
      sex: a.pre2.BG1, startedAt: state.startedAt, pre1: a.pre1, pre2: a.pre2,
      device: { userAgent: navigator.userAgent, screenW: screen.width, screenH: screen.height }
    }).then(function (res) {
      if (res && res.ok) {
        state.pid = res.participantId; state.group = res.group; state.stratum = a.pre2.BG1;
        go(next);
      } else { assignFailed(); }
    }).catch(assignFailed);
  }
  function assignFailed() {
    var btn = document.querySelector('[data-act^="submitSurvey:pre2"]');
    if (btn) { btn.disabled = false; btn.textContent = CONFIG.surveys.pre2.btnSubmit; }
    toast(CONFIG.ui.messages.assignFailed);
    var box = document.getElementById("assignErr");
    if (box) { box.textContent = CONFIG.ui.messages.assignFailed; box.hidden = false; }
  }

  /* 只在展示模式、或測試面板直接跳轉時使用的本機分派 */
  function assignGroup() {
    if (FORCE_GROUP) return FORCE_GROUP;
    return Math.random() < 0.5 ? "ai" : "none";
  }

  /* ---------- 版面元件 ---------- */
  function shell(o) {
    return '<div class="screen ' + (o.cls || "") + '">' + (o.top || "") + (o.banner || "") +
      '<main class="content ' + (o.bodyCls || "") + '" id="content">' + o.body + "</main>" +
      (o.foot ? '<footer class="bottombar">' + o.foot + "</footer>" : "") + "</div>";
  }
  function topbar(left, right) {
    return '<header class="topbar"><span class="tb-left">' + esc(left) + '</span><span class="tb-right">' + esc(right || "") + "</span></header>";
  }
  function primary(text, act, extra) {
    return '<button type="button" class="btn btn-primary ' + (extra || "") + '" data-act="' + act + '">' + esc(text) + "</button>";
  }

  /* ---------- 評量節點 ----------
   * 步驟：read（訊息逐則出現 → 我讀完了）→ ready（AI 組出現提示 → 開始判斷）
   *      → judge（可回看對話）→ respond（選回應）→ reply（R 回覆、匯合 → 繼續）
   * 計時一律用 performance.now()，紀錄時取整數毫秒
   */
  var NT = {};              // 目前節點的計時起點（只在記憶體，重新整理後重設）
  var animTimers = [];
  var tipObserver = null;
  function pnow() { return performance.now(); }
  function ms(x) { return Math.round(x); }
  function later(fn, t) { animTimers.push(setTimeout(fn, t)); }
  function clearAnim() { animTimers.forEach(clearTimeout); animTimers = []; }
  function rec() { return state.nodes[curNode().id]; }
  function newRecord() {
    var n = curNode();
    return {
      order: state.nodeIdx + 1, nodeId: n.id, type: n.type, key: n.key, group: state.group,
      promptId: isAI() ? n.promptId : null, promptVersion: isAI() ? CONFIG.meta.promptVersion : null,
      judgment: null, correct: null, response: null,
      animTime: null, readTime: null, promptTime: null, preJudgeTime: null,
      rtTotal: null, reviewCount: 0, reviewTime: 0, rt: null, judgmentChanges: 0,
      responseTime: null, hiddenCount: 0, hiddenTime: 0, interrupted: 0,
      startedAt: new Date().toISOString(), endedAt: null
    };
  }
  function enterNode(idx) {
    clearAnim();
    state.nodeIdx = idx; state.step = "read"; state.tmp = {};
    state.screen = "node";
    state.nodes[curNode().id] = newRecord();
    NT = { hiddenAcc: 0, reviewAcc: 0 };
    stepEnteredAt = Date.now();
    startRead();
  }
  // 1. 訊息逐則出現：先「輸入中…」，約 0.8 秒後換成訊息
  function startRead() {
    clearAnim();
    state.tmp.shown = 0; state.tmp.typing = true; state.tmp.animDone = false;
    NT.animStart = pnow();
    save(); render();
    var total = curNode().messages.length;
    (function next() {
      later(function () {
        state.tmp.shown += 1;
        state.tmp.typing = state.tmp.shown < total;
        if (state.tmp.shown >= total) {
          NT.lastMsgAt = pnow();
          rec().animTime = ms(NT.lastMsgAt - NT.animStart);
          state.tmp.animDone = true;
        }
        save(); render();
        if (state.tmp.shown < total) next();
      }, CONFIG.ui.messageInterval);
    })();
  }
  // 5. R 的回覆：參與者氣泡 → 輸入中… → R 回覆 → 匯合敘述 → 繼續
  function startReply() {
    clearAnim();
    state.tmp.replyStage = 0; save(); render();
    later(function () {
      state.tmp.replyStage = 1; save(); render();
      later(function () { state.tmp.replyStage = 2; save(); render(); }, CONFIG.ui.messageInterval);
    }, CONFIG.ui.messageInterval);
  }
  // AI 提示框真的出現在畫面上的時間點
  function watchTip() {
    if (tipObserver) { tipObserver.disconnect(); tipObserver = null; }
    if (!(state.screen === "node" && state.step === "ready" && isAI()) || NT.tipVisibleAt != null) return;
    var el = document.querySelector(".aitip"); if (!el) return;
    if (!("IntersectionObserver" in window)) { NT.tipVisibleAt = pnow(); return; }
    tipObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting && NT.tipVisibleAt == null && document.visibilityState === "visible") {
          NT.tipVisibleAt = pnow(); tipObserver.disconnect(); tipObserver = null;
        }
      });
    }, { threshold: 0.5 });
    tipObserver.observe(el);
  }
  // 切到別的 App：離開次數與總時長
  document.addEventListener("visibilitychange", function () {
    if (!state || state.screen !== "node" || !rec()) return;
    var r = rec();
    if (document.visibilityState === "hidden") {
      r.hiddenCount += 1; NT.hiddenStart = pnow(); r._hiddenOpen = 1;
    } else if (NT.hiddenStart != null) {
      delete r._hiddenOpen;
      NT.hiddenAcc = (NT.hiddenAcc || 0) + (pnow() - NT.hiddenStart);
      r.hiddenTime = ms(NT.hiddenAcc); NT.hiddenStart = null;
      watchTip();
    }
    save();
  });
  // 重新整理後回到節點：標記 interrupted，從目前步驟重新起算
  function resumeNode() {
    var r = rec(); if (!r) { enterNode(state.nodeIdx); return; }
    r.interrupted = 1;
    // 重新整理前瀏覽器會先觸發一次「切到背景」，那一次不算離開
    if (r._hiddenOpen) { r.hiddenCount = Math.max(0, r.hiddenCount - 1); delete r._hiddenOpen; }
    NT = { hiddenAcc: r.hiddenTime || 0, reviewAcc: 0 };
    var t = pnow();
    if (state.step === "read") { if (state.tmp.animDone) NT.lastMsgAt = t; else return startRead(); }
    if (state.step === "ready") NT.readDoneAt = t;
    if (state.step === "judge") { NT.judgeStart = t; if (state.tmp.reviewing) NT.reviewStart = t; }
    if (state.step === "respond") NT.respStart = t;
    if (state.step === "reply") state.tmp.replyStage = 2;
    save();
  }

  function chatTop() {
    var h = CONFIG.ui.chatHeader;
    return '<header class="chattop"><div class="avatar">' + esc(h.avatar) + '</div><div class="who"><b>' + esc(h.name) +
      '</b><span class="status">' + esc(h.status) + '</span></div><span class="prog">' +
      esc(progressText(state.nodeIdx + 1, nodeIds().length)) + "</span></header>";
  }
  function chatLog(n, opt) {
    opt = opt || {};
    var shown = opt.shown == null ? n.messages.length : opt.shown;
    var h = '<div class="chatlog"><div class="narr">' + esc(n.background) + "</div>" +
      n.messages.slice(0, shown).map(function (m) { return '<div class="bub r">' + esc(m) + "</div>"; }).join("");
    if (opt.typing) h += '<div class="bub r typing" aria-label="' + esc(CONFIG.ui.typing) + '">' + esc(CONFIG.ui.typing) + "</div>";
    if (opt.replyStage != null) {
      var r = n.responses.filter(function (x) { return x.id === opt.respId; })[0];
      if (r) {
        h += '<div class="bub me">' + esc(r.text) + "</div>";
        if (opt.replyStage === 0) h += '<div class="bub r typing">' + esc(CONFIG.ui.typing) + "</div>";
        if (opt.replyStage >= 1) h += '<div class="bub r">' + esc(r.reply) + "</div>";
        if (opt.replyStage >= 2) h += '<div class="narr">' + esc(n.merge) + "</div>";
      }
    }
    return h + "</div>";
  }

  screens.node = function () {
    var n = curNode(), ui = CONFIG.ui, step = state.step, tip = CONFIG.prompts[n.promptId], t = state.tmp;

    // 1. 閱讀對話：全部訊息出現後才有「我讀完了」
    if (step === "read") {
      return shell({

        foot: t.animDone ? primary(ui.btnReadDone, "readDone") : ""
      });
    }
    // 2. AI 組出現提示（無 AI 組畫面不變）→ 開始判斷
    if (step === "ready") {
      return shell({ top: chatTop(), bodyCls: "chat", body: chatLog(n), foot: (isAI() ? aiTip(tip) : "") + primary(ui.btnStartJudge, "startJudge") });
    }
    // 3. 風險判斷（含回看對話）
    if (step === "judge") {
      if (t.reviewing) {
        return shell({
          top: chatTop(), banner: '<div class="banner">' + esc(ui.reviewBanner) + "</div>",
          body: chatLog(n), bodyCls: "chat",

            '<button type="button" class="btn btn-outline btn-auto" data-act="backToJudge">‹ ' + esc(ui.btnBackToJudge) + "</button>"
        });
      }
      var j = CONFIG.judgment, sel = t.judgeSel;
      return shell({
        top: chatTop(),
        body: '<div class="judge"><p class="label">' + esc(ui.judgeHeader) + "</p><h2>" + esc(j.text) + '</h2><p class="muted">' + esc(j.note) + "</p>" +
          '<div class="choices" role="radiogroup">' + j.options.map(function (o) {
            return '<button type="button" role="radio" aria-checked="' + (sel === o.value) + '" class="choice' + (sel === o.value ? " on" : "") +
              '" data-act="judgePick" data-v="' + o.value + '"><span class="dot"></span><span>' + esc(o.icon) + " " + esc(o.label) + "</span></button>";
          }).join("") + "</div></div>",

          '<button type="button" class="btn btn-primary" data-act="submitJudge"' + (sel ? "" : " disabled") + ">" + esc(ui.btnSubmitJudge) + "</button></div>"
      });
    }
    // 4. 選擇回應（提交判斷後才出現）
    if (step === "respond") {
      return shell({
        top: chatTop(), body: chatLog(n), bodyCls: "chat",
        foot: '<p class="resp-h">' + esc(ui.respondHeader) + "</p>" + n.responses.map(function (r) {
          return '<button type="button" class="respbtn" data-act="respond" data-v="' + r.id + '">' + esc(r.text) + "</button>";
        }).join("")
      });
    }
    // 5. R 的回覆與匯合
    return shell({
      top: chatTop(), bodyCls: "chat",
      body: chatLog(n, { replyStage: t.replyStage == null ? 2 : t.replyStage, respId: (rec() || {}).responseId }),
      foot: (t.replyStage == null || t.replyStage >= 2) ? primary(ui.btnContinue, "nextNode") : ""
    });
  };

  /* ---------- 問卷 ---------- */
  function draft(key) { return state.drafts[key] || (state.drafts[key] = {}); }
  function isSkipped(it, d) { return !!(it.skipIf && it.skipIf.values.indexOf(d[it.skipIf.item]) >= 0); }
  function validAge(v) {
    var n = Number(v), it = CONFIG.surveys.pre2.items[1];
    return /^\d+$/.test(String(v).trim()) && n >= it.min && n <= it.max;
  }
  // 回傳 [[題目id, 錯誤訊息或 null], ...]
  function problems(items, d) {
    var out = [];
    items.forEach(function (it) {
      if (isSkipped(it, d)) return;
      var v = d[it.id], empty = v === undefined || v === null || String(v).trim() === "";
      if (it.inputType === "number") {
        if (empty) { if (it.required) out.push([it.id, null]); }
        else if (!validAge(v)) out.push([it.id, CONFIG.ui.messages.ageInvalid]);
        return;
      }
      if (it.required && empty) out.push([it.id, null]);
    });
    return out;
  }

  function scaleHTML(it, v, anchors) {
    var b = "";
    for (var i = 1; i <= 7; i++) {
      b += '<button type="button" class="sbtn' + (v === i ? " on" : "") + '" data-act="pick" data-q="' + it.id + '" data-v="' + i + '" aria-pressed="' + (v === i) + '">' + i + "</button>";
    }
    return '<div class="scale" role="radiogroup">' + b + '</div><div class="anchors"><span>1 ' + esc(anchors[0]) + "</span><span>7 " + esc(anchors[1]) + "</span></div>";
  }
  function choicesHTML(it, v) {
    var wrap = it.options.every(function (o) { return o.label.length <= 10; });
    return '<div class="choices' + (wrap ? " wrap" : "") + '" role="radiogroup">' + it.options.map(function (o) {
      return '<button type="button" role="radio" aria-checked="' + (v === o.value) + '" class="choice' + (v === o.value ? " on" : "") +

      if (it.otherText) {
        var other = it.options.filter(function (o) { return o.other; })[0];
        if (other && d[it.id] === other.value) {
          inner += '<div class="otherbox"><input class="inp" type="text" maxlength="50" data-in="' + it.id + '_other" placeholder="' + esc(it.otherText.placeholder) + '" value="' + esc(d[it.id + "_other"] || "") + '"></div>';
        }
      }
    }
    if (it.quote) extra = '<p class="quote">' + esc(it.quote) + "</p>";
    return qCard(it.id, num + esc(it.text), inner, extra);
  }
  screens.post2a = function () {
    var p = CONFIG.surveys.post2, d = draft("post2"), items = post2Items(1);
    var body = "<h1>" + esc(p.page1.title) + "</h1>" + p.sections.map(function (sec) {
      return '<p class="sechead">' + esc(sec.title) + "</p>" + sec.items.map(function (id) {
        return post2Card(items.filter(function (x) { return x.id === id; })[0], d);
      }).join("");
    }).join("");
    return shell({
      top: topbar(p.header, p.progress), body: body,
      foot: primary(p.page1.btnNext, "submitSurvey:post2a:" + (isAI() ? "post2b" : "debrief"), problems(items, d).length ? "dim" : "")
    });
  };
  screens.post2b = function () {
    var p = CONFIG.surveys.post2, d = draft("post2"), items = post2Items(2);
    var scale = items.filter(function (x) { return x.type === "scale7"; }), rest = items.filter(function (x) { return x.type !== "scale7"; });
    var body = "<h1>" + esc(p.page2.title) + '</h1><p class="sechead">' + esc(p.page2.scaleInstruction) + "</p>" +
      scale.map(function (it) { return post2Card(it, d); }).join("") +
      '<p class="sechead">' + esc(p.page2.choiceInstruction) + "</p>" +
      rest.map(function (it) { return post2Card(it, d); }).join("");
    return shell({
      top: topbar(p.header, p.progress), body: body,
      foot: primary(p.page2.btnSubmit, "submitSurvey:post2b:debrief", problems(items, d).length ? "dim" : "")
    });
  };

  /* 資料傳送中（進入事後說明前） */
  screens.syncing = function () {
    setTimeout(flush, 0);
    return shell({ body: '<div class="syncing"><div class="spinner" aria-hidden="true"></div><p>' + esc(CONFIG.ui.messages.syncing) + "</p></div>" });
  };

  /* 事後說明 */
  screens.debrief = function () {
    var b = CONFIG.debrief, done = state.debriefDone;
    return shell({
      body: '<p class="label">' + esc(b.header) + "</p><h1>" + esc(b.title) + "</h1><p>" + esc(b.lead) + "</p>" +
        '<div class="card q" id="q_email"><p class="field-l">' + esc(b.lottery.title) + "</p><p>" + esc(b.lottery.text) + "</p>" +
        '<p class="field-l">' + esc(b.lottery.emailLabel) + "</p>" +
        '<input class="inp" type="email" inputmode="email" autocomplete="email" data-in="_email" placeholder="' + esc(b.lottery.emailPlaceholder) + '"' + (done ? " disabled" : "") + ' value="' + esc(pendingEmail) + '">' +
        '<p class="err" hidden></p></div>' +
        b.resources.map(function (r) { return '<div class="card res"><b>' + esc(r.name) + "</b>" + esc(r.note) + "</div>"; }).join("") +
        '<p class="field-l" style="margin-top:16px">' + esc(b.contactTitle) + "</p><p>" + esc(b.contact) + "</p>",
      foot: !done ? primary(b.btnDone, "finish")
        : state.lotteryPending ? '<p class="donemsg muted">' + esc(CONFIG.ui.messages.sendFailed) + "</p>"
        : '<p class="donemsg">' + esc(b.doneMessage) + "</p>" +
          (DEMO ? '<button type="button" class="btn btn-outline" style="margin-top:8px" data-act="restartDemo">' + esc(CONFIG.ui.btnRestartDemo) + "</button>" : "")
    });
  };

  /* =====================================================================
   * 畫面輸出
   * ===================================================================== */
  function render() {
    var name = state.screen;
    // 已完成的手機：重新開啟一律顯示「已完成」頁（剛按完「完成」的這次除外）
    if (isCompleted() && !TEST && !DEBUG && !justFinished) name = "alreadyCompleted";
    var oldToast = document.querySelector(".toast"); if (oldToast) oldToast.remove();
    app.innerHTML = (screens[name] || screens.consent)();
    var c = document.getElementById("content");
    if (c) {
      // 聊天畫面捲到最下面，其他畫面回到頂端
      var chat = name === "node" && state.step !== "judge";
      c.scrollTop = chat ? c.scrollHeight : 0;
    }
    if (name === "node") watchTip();
    updateDebug();
  }

  /* ---------- 問卷：標出未作答題目 ---------- */
  function surveySpec(key) {
    var s = CONFIG.surveys;
    if (key === "pre1") return { items: s.pre1.items, d: draft("pre1") };
    if (key === "post1") return { items: s.post1.items, d: draft("post1") };
    if (key === "pre2") return { items: s.pre2.items, d: draft("pre2") };
    if (key === "post2a") return { items: post2Items(1), d: draft("post2") };
    if (key === "post2b") return { items: post2Items(2), d: draft("post2") };
  }
  function markProblems(list) {
    document.querySelectorAll(".q.missing").forEach(function (el) { el.classList.remove("missing"); });
    document.querySelectorAll(".q .err").forEach(function (el) { el.hidden = true; });
    list.forEach(function (p) {
      var el = document.getElementById("q_" + p[0]); if (!el) return;
      el.classList.add("missing");
      if (p[1]) { var e = el.querySelector(".err"); e.textContent = p[1]; e.hidden = false; }
    });
    var first = list.length && document.getElementById("q_" + list[0][0]);
    if (first) first.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function refreshDim(key) {
    var sp = surveySpec(key); if (!sp) return;
    var btn = document.querySelector('[data-act^="submitSurvey:' + key + ':"]');
    if (btn) btn.classList.toggle("dim", problems(sp.items, sp.d).length > 0);
  }
  function currentSurveyKey() {
    return { pre1: "pre1", post1: "post1", pre2: "pre2", post2a: "post2a", post2b: "post2b" }[state.screen];
  }

  function submitSurvey(key, next) {
    var sp = surveySpec(key), list = problems(sp.items, sp.d);
    if (list.length) {
      markProblems(list);
      if (list.some(function (p) { return !p[1]; })) toast(CONFIG.ui.messages.requiredMissing);
      return;
    }
    var a = state.answers;
    if (key === "pre1" || key === "post1") {
      sp.items.forEach(function (it) { a[key][it.code] = sp.d[it.id]; });
    } else if (key === "pre2") {
      sp.items.forEach(function (it) {
        a.pre2[it.id] = isSkipped(it, sp.d) ? "NA" : (it.inputType === "number" ? parseInt(sp.d[it.id], 10) : sp.d[it.id]);
      });
      // 暱稱不送分析，也不保存
      delete sp.d._nickname;
      save();
      return assignThen(next);
    } else {
      sp.items.forEach(function (it) {
        a.post2[it.id] = sp.d[it.id] === undefined ? "" : sp.d[it.id];
        if (it.otherText) a.post2[it.id + "_other"] = sp.d[it.id] === 4 ? (sp.d[it.id + "_other"] || "") : "";
      });
      if (key === "post2a" && !isAI()) {
        post2Items(2).forEach(function (it) { a.post2[it.id] = "NA"; });
      }
      if (next === "debrief") {
        // 後測完成、流程結束各送一筆；全部送完才進事後說明
        state.endedAt = new Date().toISOString();
        enqueue({ action: "post", id: state.pid + "_post", participantId: state.pid, test: TEST, post1: a.post1, post2: a.post2 });
        enqueue({ action: "finish", id: state.pid + "_finish", participantId: state.pid, test: TEST, endedAt: state.endedAt, resumes: state.resumes || 0 });
        return go(sendsData() ? "syncing" : "debrief");
      }
    }
    go(next);
  }

  /* =====================================================================
   * 事件
   * ===================================================================== */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");

    if (act.indexOf("next:") === 0) return go(act.slice(5));
    if (act.indexOf("submitSurvey:") === 0) { var p = act.split(":"); return submitSurvey(p[1], p[2]); }

    switch (act) {
      case "toggleConsent":
        consentOpen = !consentOpen;
        var y = document.getElementById("content").scrollTop;
        render(); document.getElementById("content").scrollTop = y;
        return;
      case "agree":
        if (!state.clientId) { state.clientId = uuid(); state.startedAt = new Date().toISOString(); }
        return go("pre1");
      case "disagree":
        // 不記錄任何資料：清掉暫存
        state = freshState(); try { localStorage.removeItem(LS_STATE); } catch (e2) {}
        state.screen = "notParticipating"; render(); return;
      case "backToConsent":
        consentOpen = false; state = freshState(); render(); return;

      case "pick": {
        var key = currentSurveyKey(), q = el.getAttribute("data-q"), d = draft(key === "post2a" || key === "post2b" ? "post2" : key);
        d[q] = parseInt(v, 10);
        // 前測二第 3 題改變時，第 4 題可能要停用；後測二「其他」要展開輸入框 → 重畫並保留捲動位置
        var needRerender = (q === "BG3") || (q === "POST2_1");
        save();
        if (needRerender) {
          var y2 = document.getElementById("content").scrollTop;
          if (q === "BG3" && isSkipped(CONFIG.surveys.pre2.items[3], d)) delete d.BG4;
          render(); document.getElementById("content").scrollTop = y2;
        } else {
          var group = el.parentNode;
          group.querySelectorAll("[data-act=pick]").forEach(function (b) {
            var on = b === el; b.classList.toggle("on", on);
            b.setAttribute(b.getAttribute("role") === "radio" ? "aria-checked" : "aria-pressed", on);
          });
          var card = document.getElementById("q_" + q);
          if (card) { card.classList.remove("missing"); var er = card.querySelector(".err"); if (er) er.hidden = true; }
          refreshDim(key);
        }
        return;
      }

      /* 節點 */
      case "startNodes": return enterNode(0);
      case "readDone": {
        var t1 = pnow(); rec().readTime = ms(t1 - NT.lastMsgAt); NT.readDoneAt = t1;
        return setStep("ready");
      }
      case "startJudge": {
        var t2 = pnow(), r2 = rec();
        r2.preJudgeTime = ms(t2 - NT.readDoneAt);
        if (isAI()) r2.promptTime = NT.tipVisibleAt != null ? ms(t2 - NT.tipVisibleAt) : null;
        NT.judgeStart = t2; NT.reviewAcc = 0;
        return setStep("judge");
      }
      case "judgePick": {
        var nv = parseInt(v, 10);
        if (state.tmp.judgeSel && state.tmp.judgeSel !== nv) rec().judgmentChanges += 1;
        state.tmp.judgeSel = nv; save(); render(); return;
      }
      case "review":
        rec().reviewCount += 1; NT.reviewStart = pnow();
        state.tmp.reviewing = true; save(); render(); return;
      case "backToJudge":
        NT.reviewAcc += pnow() - NT.reviewStart; NT.reviewStart = null;
        rec().reviewTime = ms(NT.reviewAcc);
        state.tmp.reviewing = false; save(); render(); return;
      case "submitJudge": {
        if (!state.tmp.judgeSel) return;
        var t3 = pnow(), r3 = rec(), n3 = curNode();
        r3.rtTotal = ms(t3 - NT.judgeStart);
        r3.reviewTime = ms(NT.reviewAcc);
        r3.rt = r3.rtTotal - r3.reviewTime;
        r3.judgment = state.tmp.judgeSel;
        r3.correct = n3.key == null ? null : (r3.judgment === n3.key ? 1 : 0);
        state.tmp = {};
        setStep("respond");
        NT.respStart = pnow();
        return;
      }
      case "respond": {
        var r4 = rec();
        r4.responseTime = ms(pnow() - NT.respStart);
        r4.responseId = v;
        r4.response = { A: 1, B: 2, C: 3 }[v];
        state.step = "reply"; state.tmp = {}; stepEnteredAt = Date.now();
        return startReply();
      }
      case "nextNode": {
        var r5 = rec();
        r5.endedAt = new Date().toISOString();
        r5.hiddenTime = ms(NT.hiddenAcc || 0);
        enqueue({ action: "node", id: state.pid + "_" + r5.nodeId, participantId: state.pid, test: TEST, record: r5 });
        if (state.nodeIdx + 1 >= nodeIds().length) { state.step = "done"; return go("simEnd"); }
        return enterNode(state.nodeIdx + 1);
      }

      case "finish": {
        var inp = document.querySelector('[data-in="_email"]'), em = (inp.value || "").trim();
        if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) {
          markProblems([["email", CONFIG.ui.messages.emailInvalid]]); return;
        }
        state.debriefDone = true; justFinished = true;
        if (em && sendsData()) {
          // 抽獎信箱另送，不附參與者編號；送成功後佇列裡的這筆就刪掉
          state.lotteryPending = true;
          enqueue({ action: "lottery", id: uuid(), email: em });
        }
        pendingEmail = "";
        if (!DEMO) {
          try { localStorage.setItem(LS_DONE, "1"); localStorage.removeItem(LS_STATE); } catch (e3) {}
        }
        render(); return;
      }
      case "restartDemo":
        try { localStorage.removeItem(LS_STATE); } catch (e5) {}
        justFinished = false; consentOpen = false; pendingEmail = "";
        state = freshState(); save(); render(); return;
    }
  });

  // 文字輸入與下拉選單
  function onInput(e) {
    var el = e.target, id = el.getAttribute("data-in"); if (!id) return;
    if (id === "_email") { pendingEmail = el.value; return; }
    var key = currentSurveyKey(); if (!key) return;
    var d = draft(key === "post2a" || key === "post2b" ? "post2" : key);
    if (el.tagName === "SELECT") {
      d[id] = el.value === "" ? undefined : parseInt(el.value, 10);
      if (id === "BG3") {
        if (isSkipped(CONFIG.surveys.pre2.items[3], d)) delete d.BG4;
        var y = document.getElementById("content").scrollTop; save(); render(); document.getElementById("content").scrollTop = y; return;
      }
    } else {
      d[id] = id === "BG2" ? el.value.replace(/\D/g, "") : el.value;
      if (id === "BG2" && el.value !== d[id]) el.value = d[id];
    }
    var card = document.getElementById("q_" + id);
    if (card) { card.classList.remove("missing"); var er = card.querySelector(".err"); if (er) er.hidden = true; }
    save(); refreshDim(key);
  }
  app.addEventListener("input", onInput);
  app.addEventListener("change", function (e) { if (e.target.tagName === "SELECT") onInput(e); });

  /* ---------- 瀏覽器返回鍵：不讓流程倒退 ---------- */
  history.replaceState({ meetoo: 0 }, "");
  history.pushState({ meetoo: 1 }, "");
  window.addEventListener("popstate", function () { history.pushState({ meetoo: 1 }, ""); });

  /* =====================================================================
   * 測試面板（?debug=1）
   * ===================================================================== */
  var dbg = null;
  var SCREEN_LIST = ["consent", "pre1", "material", "appStart", "pre2", "scenarioIntro", "instructions", "node", "simEnd", "post1", "post2a", "post2b", "debrief", "notParticipating", "alreadyCompleted"];
  function ensureTestSubject() {
    // 用測試面板直接跳轉時沒有經過建立檔案：只在本機跑，不送資料
    if (!state.clientId) { state.clientId = uuid(); state.startedAt = new Date().toISOString(); }
    if (!state.pid) { state.pid = "LOCAL"; state.noSend = true; }
    if (!state.group) state.group = assignGroup();
  }
  function buildDebug() {
    dbg = document.createElement("div"); dbg.id = "dbg";
    dbg.innerHTML = '<button class="dbg-tog" data-d="tog">DEBUG</button><div class="dbg-body" hidden><div id="dbg-info"></div>' +
      '<select data-d="node"><option value="">跳到節點…</option>' + nodeIds().map(function (id, i) {
        return '<option value="' + i + '">' + (i + 1) + ". " + id + " " + CONFIG.nodes[id].title + "</option>";
      }).join("") + "</select>" +
      '<select data-d="screen"><option value="">跳到畫面…</option>' + SCREEN_LIST.map(function (s) { return '<option value="' + s + '">' + s + "</option>"; }).join("") + "</select>" +
      '<button class="d" data-d="json">顯示紀錄（JSON）</button><button class="d" data-d="group">切換組別</button><button class="d" data-d="reset">重設（清除進度與已完成標記）</button></div>';
    document.body.appendChild(dbg);
    dbg.addEventListener("click", function (e) {
      var a = e.target.getAttribute("data-d");
      if (a === "json") { dbg.querySelector(".dbg-body").hidden = true; showJSON(); }
      if (a === "tog") { var b = dbg.querySelector(".dbg-body"); b.hidden = !b.hidden; }
      if (a === "group") { ensureTestSubject(); state.group = isAI() ? "none" : "ai"; save(); render(); }
      if (a === "reset") { try { localStorage.removeItem(LS_STATE); localStorage.removeItem(LS_DONE); localStorage.removeItem(LS_QUEUE); } catch (e4) {} location.reload(); }
    });
    dbg.addEventListener("change", function (e) {
      var a = e.target.getAttribute("data-d"), v = e.target.value; if (v === "") return;
      ensureTestSubject();
      if (a === "node") enterNode(parseInt(v, 10));
      else if (a === "screen") { if (v === "node") enterNode(state.nodeIdx || 0); else go(v); }
      e.target.value = "";
    });
    setInterval(updateDebug, 250);
  }
  function showJSON() {
    var old = document.getElementById("dbg-json"); if (old) old.remove();
    var data = {
      participantId: state.pid, group: state.group, stratum: state.stratum || null, test: state.test,
      startedAt: state.startedAt, resumes: state.resumes, screen: state.screen,
      answers: state.answers,
      nodes: nodeIds().filter(function (id) { return state.nodes[id]; }).map(function (id) { return state.nodes[id]; })
    };
    var box = document.createElement("div"); box.id = "dbg-json";
    box.innerHTML = '<div class="dj-bar"><b>目前紀錄</b><button data-j="copy">複製</button><button data-j="close">關閉</button></div><pre></pre>';
    box.querySelector("pre").textContent = JSON.stringify(data, null, 2);
    box.addEventListener("click", function (e) {
      var j = e.target.getAttribute("data-j");
      if (j === "close") box.remove();
      if (j === "copy" && navigator.clipboard) navigator.clipboard.writeText(box.querySelector("pre").textContent);
    });
    document.body.appendChild(box);
  }
  function updateDebug() {
    if (!DEBUG || !dbg) return;
    var info = dbg.querySelector("#dbg-info"), n = state.screen === "node" ? curNode() : null;
    info.innerHTML = "組別：" + esc(state.group || "（未分派）") + (FORCE_GROUP ? "（網址指定）" : "") +
      "<br>畫面：" + esc(state.screen) +
      (n ? "<br>節點：" + (state.nodeIdx + 1) + "/" + nodeIds().length + " " + n.id + "（" + n.type + "，" + n.promptId + "）<br>步驟：" + esc(state.step) + (state.tmp.reviewing ? "（回看中）" : "") : "") +
      "<br>本步驟計時：" + ((Date.now() - stepEnteredAt) / 1000).toFixed(1) + " 秒" +
      (state.startedAt ? "<br>總計時：" + Math.round((Date.now() - Date.parse(state.startedAt)) / 1000) + " 秒" : "") +
      (state.pid ? "<br>編號：" + esc(state.pid) : "") +
      "<br>模式：" + (DEMO ? "展示（不連後端）" : state.noSend ? "本機（不送資料）" : TEST ? "測試（test: true）" : "正式") +
      "<br>後端：" + (backendReady() ? "已設定" : "未設定") + "｜待傳：" + qLoad().length + " 筆";
  }

  /* =====================================================================
   * 啟動
   * ===================================================================== */
  var saved = load();
  if (saved) {
    state = saved;
    if (state.clientId && !state.debriefDone && state.screen !== "consent") {
      state.resumes = (state.resumes || 0) + 1;   // 曾中斷後接續
      setTimeout(function () { toast(CONFIG.ui.messages.resumeNotice); }, 300);
    }
  } else {
    state = freshState();
  }
  if (state.screen === "notParticipating") state = freshState();
  if (FORCE_GROUP && state.group && state.group !== FORCE_GROUP) state.group = FORCE_GROUP;
  if (DEBUG) buildDebug();
  if (state.screen === "node" && !isCompleted()) resumeNode();
  save(); render();
  flush();
})();

</script>
</body>
</html>
